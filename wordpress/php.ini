; ACME WordPress — lab PHP configuration
; Mirrors the profile required by the ASLR-bypass chain.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; The chain's OOM trigger calibrates against this limit. WordPress itself
; only needs ~4-6MB per request, so 8M stays comfortably above its floor.
memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
